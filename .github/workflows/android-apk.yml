name: Android APK

# Compila o APK de teste na nuvem (não precisa de Flutter nem Android Studio no PC).
# Roda a cada envio para a branch main e também manualmente pela aba Actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analisar, testar e compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versões
        run: |
          flutter --version
          java -version

      - name: SQLite para os testes automatizados
        run: sudo apt-get update -y && sudo apt-get install -y libsqlite3-dev

      - name: Gerar e configurar plataforma Android
        run: bash tools/prepare_android.sh

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test --reporter expanded

      - name: flutter build apk --debug
        run: flutter build apk --debug

      - name: Nomear APK
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          NAME="UNITECH_XMETER_CONNECT_v${VERSION}_teste_${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "$NAME"
          ls -lh "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          retention-days: 30
          if-no-files-found: error
